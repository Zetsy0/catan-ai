[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catan-ai"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
visualization = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]